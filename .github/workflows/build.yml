name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev
        pip install --upgrade pip
        pip install --user --upgrade Cython==0.29.36 buildozer

    - name: Accept Android SDK licenses
      run: mkdir -p ~/.android && touch ~/.android/repositories.cfg && yes | ~/.local/bin/buildozer android update --accept-licenses || true

    - name: Build with Buildozer
      run: ~/.local/bin/buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
