name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade setuptools wheel
        python3 -m pip install --user Cython==0.29.36 buildozer

    - name: Force Install SDK Commandline Tools to Exact Path
      run: |
        ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_HOME/tools/bin"
        cd "$ANDROID_HOME"
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools.zip
        rm -rf "$ANDROID_HOME/tools/bin/*"
        cp -r cmdline-tools/bin/* "$ANDROID_HOME/tools/bin/"
        cp -r cmdline-tools/lib "$ANDROID_HOME/tools/"
        yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses --sdk_root="$ANDROID_HOME" || true

    - name: Build with Buildozer
      run: ~/.local/bin/buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
